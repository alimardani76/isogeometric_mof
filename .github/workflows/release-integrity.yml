name: Release integrity

on:
  pull_request:
  push:
    branches:
      - release/paper7b-public

permissions:
  contents: read

jobs:
  repository-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run public-release integrity checks
        run: python3 scripts/release/check_repository_integrity.py
