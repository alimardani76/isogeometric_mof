name: Apply exact structural final assets

on:
  push:
    branches:
      - release/paper7b-public
    paths:
      - ".release_tmp/**"
      - ".github/workflows/apply-structural-final-assets.yml"

permissions:
  contents: write

jobs:
  apply-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/paper7b-public
          fetch-depth: 0

      - name: Reconstruct exact uploaded PDF and PPTX
        shell: bash
        run: |
          set -euo pipefail

          cat .release_tmp/pdf_*.part > /tmp/structural_pdf.zstpatch.b64
          cat .release_tmp/pptx_*.part > /tmp/structural_pptx.zstpatch.b64

          test "$(wc -c < /tmp/structural_pdf.zstpatch.b64)" = "9192"
          test "$(wc -c < /tmp/structural_pptx.zstpatch.b64)" = "18828"

          printf '%s' "64433bbfb93e29dc5d3200cdc94bc122e1a2b894a7059e7255fe68106d2c2c67  /tmp/structural_pdf.zstpatch.b64" | sha256sum -c -
          printf '%s' "6cf374a61de54e3c8ce021cd2af4dd074057d07a60bf9d83b7d934294cc2f87d  /tmp/structural_pptx.zstpatch.b64" | sha256sum -c -

          base64 -d /tmp/structural_pdf.zstpatch.b64 > /tmp/structural_pdf.zstpatch
          base64 -d /tmp/structural_pptx.zstpatch.b64 > /tmp/structural_pptx.zstpatch

          echo "39ffec83fbaf6b9bf8e0e17495142ceab058c86412ae32b6f9b694034373952f  /tmp/structural_pdf.zstpatch" | sha256sum -c -
          echo "07f3065c669701f329a45d6e3800c4a58166048fc569ad086f5d8b98d94d0d93  /tmp/structural_pptx.zstpatch" | sha256sum -c -

          zstd -d --patch-from=structural_panel/figures/final/Structural_Panel_FINAL.pdf \
            /tmp/structural_pdf.zstpatch -o /tmp/Structural_Panel_FINAL.pdf -f

          zstd -d --patch-from=structural_panel/figures/final/Structural_Panel_FINAL.pptx \
            /tmp/structural_pptx.zstpatch -o /tmp/Structural_Panel_FINAL.pptx -f

          echo "64db93251142ad685d4ab357bc4c7d75c588389dd0395d5a1d5dc687ebc2a830  /tmp/Structural_Panel_FINAL.pdf" | sha256sum -c -
          echo "16616b7a69e7a57f248210666acbadfd6c8cb62ec9fdbb21df6b72cb647d0f16  /tmp/Structural_Panel_FINAL.pptx" | sha256sum -c -

          test "$(stat -c%s /tmp/Structural_Panel_FINAL.pdf)" = "18865852"
          test "$(stat -c%s /tmp/Structural_Panel_FINAL.pptx)" = "18194343"

          cp /tmp/Structural_Panel_FINAL.pdf structural_panel/figures/final/Structural_Panel_FINAL.pdf
          cp /tmp/Structural_Panel_FINAL.pptx structural_panel/figures/final/Structural_Panel_FINAL.pptx
          cp /tmp/Structural_Panel_FINAL.pdf figures/main/Figure_05.pdf

      - name: Update structural release manifest
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path("structural_panel/data/manifests/REPO_PAYLOAD_SHA256.csv")
          rows = list(csv.DictReader(path.open("r", encoding="utf-8", newline="")))
          updates = {
              "figures/final/Structural_Panel_FINAL.pdf": (
                  "18865852",
                  "64db93251142ad685d4ab357bc4c7d75c588389dd0395d5a1d5dc687ebc2a830",
              ),
              "figures/final/Structural_Panel_FINAL.pptx": (
                  "18194343",
                  "16616b7a69e7a57f248210666acbadfd6c8cb62ec9fdbb21df6b72cb647d0f16",
              ),
          }
          seen = set()
          for row in rows:
              if row["path"] in updates:
                  row["bytes"], row["sha256"] = updates[row["path"]]
                  seen.add(row["path"])
          missing = set(updates) - seen
          if missing:
              raise SystemExit(f"Manifest rows missing: {sorted(missing)}")
          with path.open("w", encoding="utf-8", newline="") as handle:
              writer = csv.DictWriter(handle, fieldnames=["path", "bytes", "sha256"], lineterminator="\n")
              writer.writeheader()
              writer.writerows(rows)
          PY

      - name: Remove temporary transport
        run: |
          rm -rf .release_tmp
          rm -f .github/workflows/apply-structural-final-assets.yml

      - name: Commit exact final assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add structural_panel/figures/final/Structural_Panel_FINAL.pdf
          git add structural_panel/figures/final/Structural_Panel_FINAL.pptx
          git add structural_panel/data/manifests/REPO_PAYLOAD_SHA256.csv
          git add figures/main/Figure_05.pdf
          git add -A .release_tmp .github/workflows/apply-structural-final-assets.yml
          git commit -m "figures(structural): install exact user-supplied final assets"
          git push origin HEAD:release/paper7b-public
